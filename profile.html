<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="erp-layout">
    <aside class="sidebar">
      <div>
        <h2>ERP Panel</h2>
        <ul class="sidebar-menu">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="profile.html" class="active">Profile</a></li>
          <li><a href="subjects.html">Subjects</a></li>
          <li><a href="attendance.html">Attendance</a></li>
          <li><a href="assignments.html">Assignments</a></li>
          <li><a href="results.html">Results</a></li>
          <li><a href="fees.html">Fees</a></li>
          <li><a href="notice.html">Notice Board</a></li>
        </ul>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div><h1>Profile</h1><p id="topWelcome">Welcome back</p></div>
        <div class="top-badge" id="topBadge"></div>
      </div>

      <div class="content-area">
        <div class="card">
          <div class="detail-row"><div class="detail-label">Full Name</div><div class="detail-value" id="profileName"></div></div>
          <div class="detail-row"><div class="detail-label">Date of Birth</div><div class="detail-value" id="profileDob"></div></div>
          <div class="detail-row"><div class="detail-label">Username</div><div class="detail-value" id="profileUsername"></div></div>
          <div class="detail-row"><div class="detail-label">Course</div><div class="detail-value">BCA</div></div>
          <div class="detail-row"><div class="detail-label">Department</div><div class="detail-value">Computer Applications</div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
