<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>
<body>
  
<div class="tool-container">

<h2>Image to PDF Converter</h2>

<input type="file" id="imageInput" accept="image/*" multiple>

<br><br>

<button onclick="convertToPDF()">Convert to PDF</button>

</div>

<!-- NAVBAR -->

<nav>

<div class="logo">
<h2>PDF Tools</h2>
</div>

<ul class="nav-links">
<li><a href="#">Merge PDF</a></li>
<li><a href="#">Split PDF</a></li>
<li><a href="#">Compress PDF</a></li>
<li><a href="#">Convert PDF</a></li>
</ul>

<div class="auth">
<a href="#" class="login">Login</a>
<a href="#" class="signup">Sign up</a>
</div>

</nav>

<!-- MAIN SECTION -->

<section class="main">

<h1>JPG to PDF</h1>

<p>Convert JPG images to PDF in seconds. Easily adjust orientation and margins.</p>

<button class="upload-btn">Select JPG Images</button>

<p class="drag-text">or drop JPG images here</p>

</section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

async function convertToPDF() {

const { jsPDF } = window.jspdf;

const input = document.getElementById("imageInput");

if(input.files.length === 0){
alert("Please upload an image");
return;
}

const pdf = new jsPDF();

for(let i=0;i<input.files.length;i++){

const file = input.files[i];

const reader = new FileReader();

await new Promise(resolve => {

reader.onload = function(e){

const img = new Image();

img.src = e.target.result;

img.onload = function(){

const width = pdf.internal.pageSize.getWidth();
const height = (img.height * width) / img.width;

if(i>0) pdf.addPage();

pdf.addImage(img, 'JPEG', 0, 0, width, height);

resolve();

}

}

reader.readAsDataURL(file);

});

}

pdf.save("converted.pdf");

}

</script>

</body>
</html>
