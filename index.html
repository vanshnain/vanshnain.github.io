<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College ERP Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #d9e7ff, #f7fbff);
      min-height: 100vh;
      color: #1f2d3d;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 32px 28px;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #0d6efd;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .college-title {
      font-size: 24px;
      font-weight: bold;
      color: #133b7a;
      margin-bottom: 6px;
      text-align: center;
    }

    .sub-text {
      text-align: center;
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
    }

    .btn {
      width: 100%;
      border: none;
      background: #0d6efd;
      color: #fff;
      padding: 13px;
      font-size: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      background: #0b5ed7;
    }

    .error-message {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      color: #d93025;
      font-weight: 600;
    }

    .dashboard {
      min-height: 100vh;
    }

    .topbar {
      background: #0d6efd;
      color: white;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .topbar h1 {
      font-size: 24px;
    }

    .topbar .welcome {
      font-size: 15px;
      font-weight: 500;
    }

    .logout-btn {
      border: none;
      background: #ffffff;
      color: #0d6efd;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 22px;
    }

    .card h2 {
      font-size: 19px;
      color: #133b7a;
      margin-bottom: 16px;
      border-bottom: 1px solid #e9eef5;
      padding-bottom: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f3f7;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 700;
      color: #4b5563;
    }

    .info-value {
      text-align: right;
      color: #111827;
    }

    .subject-list,
    .assignment-list {
      list-style: none;
    }

    .subject-list li,
    .assignment-list li {
      padding: 11px 12px;
      margin-bottom: 10px;
      background: #f8fbff;
      border: 1px solid #dde8fb;
      border-radius: 10px;
      font-size: 14px;
    }

    .attendance-box {
      text-align: center;
      padding: 10px 0 0;
    }

    .attendance-value {
      font-size: 38px;
      font-weight: bold;
      color: #0d6efd;
      margin-bottom: 10px;
    }

    .attendance-note {
      font-size: 14px;
      color: #6b7280;
    }

    .status-good {
      color: #198754;
      font-weight: bold;
    }

    .status-average {
      color: #fd7e14;
      font-weight: bold;
    }

    .status-low {
      color: #dc3545;
      font-weight: bold;
    }

    .footer-note {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 16px 18px;
      }

      .topbar h1 {
        font-size: 20px;
      }

      .login-card {
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>

  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="logo-box">
        <div class="logo-circle">ERP</div>
        <div class="college-title">College ERP Portal</div>
        <div class="sub-text">Please sign in to continue</div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">User ID</label>
          <input type="text" id="username" placeholder="Enter your username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn">Sign In</button>
        <div id="errorMessage" class="error-message"></div>
      </form>
    </div>
  </div>

  <div id="dashboardPage" class="dashboard hidden">
    <div class="topbar">
      <div>
        <h1>ERP Student Dashboard</h1>
        <div class="welcome" id="welcomeText">Welcome</div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="dashboard-container">
      <div class="grid">
        <div class="card">
          <h2>Student Details</h2>
          <div class="info-row">
            <div class="info-label">Name</div>
            <div class="info-value" id="studentName"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Date of Birth</div>
            <div class="info-value" id="studentDob"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Username</div>
            <div class="info-value" id="studentUsername"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Department</div>
            <div class="info-value">Bsc. (hons) Computer Science</div>
          </div>
        </div>

        <div class="card">
          <h2>Overall Attendance</h2>
          <div class="attendance-box">
            <div class="attendance-value" id="studentAttendance"></div>
            <div class="attendance-note" id="attendanceStatus"></div>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Subjects Allotted</h2>
          <ul class="subject-list" id="subjectList"></ul>
        </div>

        <div class="card">
          <h2>Assignments</h2>
          <ul class="assignment-list" id="assignmentList"></ul>
        </div>
      </div>

      <div class="footer-note">
        ERP Portal
      </div>
    </div>
  </div>

  <script>
    const students = [
      {
        name: "Vansh Nain",
        dob: "07/06/2006",
        username: "vansh.nain",
        password: "vansh@0087",
        subjects: ["HTML", "C++", "DBMS", "CN"],
        attendance: "76.79%",
        assignments: [
          "HTML Website Design",
          "C++ File Handling Program",
          "DBMS ER Diagram Project",
          "Computer Networks Assignment"
        ]
      },
      {
        name: "Shivansh Pandey",
        dob: "14/02/2006",
        username: "shivansh.pandey",
        password: "shivansh@0060",
        subjects: ["HTML", "C++", "DBMS", "CN"],
        attendance: "86.1%",
        assignments: [
          "HTML Website Design",
          "C++ OOP Concepts Assignment",
          "DBMS Normalization Assignment",
          "Computer Networks Topology Report"
        ]
      },
      {
        name: "Mayank Kataria",
        dob: "18/08/2006",
        username: "mayank.kataria",
        password: "mayank@0037",
        subjects: ["HTML", "C++", "DBMS", "CN"],
        attendance: "100%",
        assignments: [
          "HTML Homepage Layout",
          "C++ Loops and Arrays Program",
          "DBMS SQL Queries Assignment",
          "Computer Networks Basics Worksheet"
        ]
      }
    ];

    const loginForm = document.getElementById("loginForm");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();

      const foundStudent = students.find(
        student =>
          student.username === usernameInput &&
          student.password === passwordInput
      );

      if (foundStudent) {
        showDashboard(foundStudent);
        errorMessage.textContent = "";
      } else {
        errorMessage.textContent = "Invalid username or password.";
      }
    });

    function showDashboard(student) {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("dashboardPage").classList.remove("hidden");

      document.getElementById("welcomeText").textContent = `Welcome, ${student.name}`;
      document.getElementById("studentName").textContent = student.name;
      document.getElementById("studentDob").textContent = student.dob;
      document.getElementById("studentUsername").textContent = student.username;
      document.getElementById("studentAttendance").textContent = student.attendance;

      const attendanceNumber = parseFloat(student.attendance);
      const attendanceStatus = document.getElementById("attendanceStatus");

      if (attendanceNumber >= 75) {
        attendanceStatus.innerHTML = `<span class="status-good">Good Standing</span>`;
      } else if (attendanceNumber >= 60) {
        attendanceStatus.innerHTML = `<span class="status-average">Average Attendance</span>`;
      } else {
        attendanceStatus.innerHTML = `<span class="status-low">Low Attendance</span>`;
      }

      const subjectList = document.getElementById("subjectList");
      subjectList.innerHTML = "";
      student.subjects.forEach(subject => {
        const li = document.createElement("li");
        li.textContent = subject;
        subjectList.appendChild(li);
      });

      const assignmentList = document.getElementById("assignmentList");
      assignmentList.innerHTML = "";
      student.assignments.forEach(assignment => {
        const li = document.createElement("li");
        li.textContent = assignment;
        assignmentList.appendChild(li);
      });
    }

    function logout() {
      document.getElementById("dashboardPage").classList.add("hidden");
      document.getElementById("loginPage").classList.remove("hidden");
      document.getElementById("loginForm").reset();
      errorMessage.textContent = "";
    }
  </script>
</body>
</html>
