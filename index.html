<!DOCTYPE html>
<html>
<head>
<title>SmartRoute AI</title>

<style>
body { font-family: Arial; background:#0a0a0a; color:white; text-align:center; }
h1 { color:#00bcd4; }

input,select,button {
  padding:10px; margin:5px;
  border-radius:8px;
  border:none;
}

button {
  background:#00bcd4;
  cursor:pointer;
}

#result {
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🚚 SmartRoute AI</h1>

<select id="key">
  <option value="deadline">Deadline</option>
  <option value="priority">Priority</option>
  <option value="weight">Weight</option>
  <option value="score">🔥 Smart Score</option>
</select>

<br>

<button onclick="run()">Optimize</button>

<div id="result"></div>

<script>
async function run(){
  const key = document.getElementById("key").value;

  document.getElementById("result").innerHTML = "Optimizing using SmartRoute AI...";

  const data = await fetch("http://localhost:5000/api/generate");
  const json = await data.json();

  const res = await fetch("http://localhost:5000/api/sort",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      packages: json.packages,
      key: key
    })
  });

  const out = await res.json();

  let html = "<h3>Result:</h3>";

  out.sorted.forEach(p=>{
    html += `
      <p>
        ${p.id} | Priority: ${p.priority} | Deadline: ${p.deadline} 
        | Score: ${p.score.toFixed(2)} | ${p.vehicle.icon}
      </p>`;
  });

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
